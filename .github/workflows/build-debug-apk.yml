name: Build Android Debug APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build KKHM Off-Course Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify or restore Firebase google-services.json
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            echo "Restoring app/google-services.json from GitHub Actions secret."
            printf '%s\n' "$GOOGLE_SERVICES_JSON" > app/google-services.json
          fi

          if [ ! -f app/google-services.json ]; then
            echo "::error::Missing app/google-services.json. Add the contents of app/google-services.json as a repository secret named GOOGLE_SERVICES_JSON in GitHub Settings -> Secrets and variables -> Actions."
            exit 1
          fi

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Prepare Android SDK licenses
        run: |
          SDK_DIR="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          echo "Using Android SDK at: $SDK_DIR"
          echo "ANDROID_HOME=$SDK_DIR" >> "$GITHUB_ENV"
          SDKMANAGER_BIN="$(command -v sdkmanager || find "$SDK_DIR/cmdline-tools" -name sdkmanager -type f 2>/dev/null | head -n 1 || true)"
          if [ -n "$SDKMANAGER_BIN" ]; then
            yes | "$SDKMANAGER_BIN" --licenses >/dev/null 2>&1 || true
          else
            mkdir -p "$SDK_DIR/licenses"
            printf '\n24333f8a63b6825ea9c5514f83c2829b004d1fee' > "$SDK_DIR/licenses/android-sdk-license"
            printf '\n84831b9409646a918e30573bab4c9c91346d8abd' > "$SDK_DIR/licenses/android-sdk-preview-license"
          fi

      - name: Prepare debug keystore
        env:
          DEBUG_KEYSTORE_BASE64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$DEBUG_KEYSTORE_BASE64" ]; then
            echo "Using persistent debug.keystore from GitHub Actions secret."
            printf '%s' "$DEBUG_KEYSTORE_BASE64" | tr -d '\n\r ' | base64 --decode > debug.keystore
            KEYSTORE_SOURCE="GitHub Secret (DEBUG_KEYSTORE_BASE64)"
          else
            echo "DEBUG_KEYSTORE_BASE64 secret not configured; generating ephemeral debug.keystore."
            keytool -genkeypair -v \
              -keystore debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=KKHM Off-Course Debug,O=KKHM Islamic and Arts College,C=IN"
            KEYSTORE_SOURCE="Auto-generated ephemeral keystore"
          fi

          CERT_INFO=$(keytool -list -v -keystore debug.keystore -alias androiddebugkey -storepass android)
          SHA1=$(printf '%s\n' "$CERT_INFO" | awk -F': ' '/SHA1:/{print $2; exit}')
          SHA256=$(printf '%s\n' "$CERT_INFO" | awk -F': ' '/SHA256:/{print $2; exit}')

          {
            echo "## KKHM Off-Course — Build Summary"
            echo ""
            echo "- **Keystore source:** ${KEYSTORE_SOURCE}"
            echo "- **Application ID:** \`com.aistudio.cicoffcourse.mvrkpt\`"
            echo "- **Signing SHA-1:** \`${SHA1}\`"
            echo "- **Signing SHA-256:** \`${SHA256}\`"
            echo ""
            if [ -z "$DEBUG_KEYSTORE_BASE64" ]; then
              echo "> **Google Sign-In & Firebase Note:** Because \`DEBUG_KEYSTORE_BASE64\` is not yet saved in GitHub Secrets, this APK was signed with a new keystore. To enable Google Sign-In on this APK, add the **Signing SHA-1** above inside **Firebase Console → Project Settings (\`gen-lang-client-0628851552\`) → Your apps (\`com.aistudio.cicoffcourse.mvrkpt\`) → Add fingerprint**."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.3.1'

      - name: Run unit tests
        run: gradle :app:testDebugUnitTest --no-daemon

      - name: Build Debug APK
        run: gradle :app:assembleDebug --no-daemon

      - name: Package APK for download
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/KKHM-Off-Course-debug.apk

      - name: Upload Debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: KKHM-Off-Course-Debug-APK
          path: dist/KKHM-Off-Course-debug.apk
          retention-days: 30

      - name: Publish Debug APK to latest GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view latest >/dev/null 2>&1; then
            gh release upload latest dist/KKHM-Off-Course-debug.apk --clobber
          else
            gh release create latest dist/KKHM-Off-Course-debug.apk \
              --title "KKHM Off-Course (Latest Debug APK)" \
              --notes "Latest Android Debug APK for KKHM Islamic & Arts College."
          fi
